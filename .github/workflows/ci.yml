name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Unit + race
        run: go test -race -count=1 ./...
      - name: Compose config
        run: docker compose -f compose.dev.yaml config --quiet

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SDK tests
        run: python -m unittest discover -s sdk -p 'test_*.py' -v
